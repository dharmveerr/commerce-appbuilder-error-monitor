
# The [post-app-deploy, pre-app-build] hooks are auto-generated. Do not remove or manually edit.
hooks:
  post-app-deploy: EXTENSION=extensibility/1 npx aio-commerce-lib-app hooks post-app-deploy
  pre-app-build: EXTENSION=extensibility/1 npx aio-commerce-lib-app hooks pre-app-build

operations:
  # These worker processes definitions are auto-generated. Do not remove or manually edit.
  workerProcess:
    - type: action
      impl: app-management/app-config
    - type: action
      impl: app-management/association
    - type: action
      impl: app-management/installation

runtimeManifest:
  packages:
    # This package definition is auto-generated. Do not remove or manually edit.
    app-management:
      license: Apache-2.0
      inputs:
        LOG_LEVEL: $LOG_LEVEL
      actions:
        app-config:
          function: .generated/actions/app-management/app-config.js
          web: yes
          runtime: nodejs:26
          annotations:
            final: true
            require-adobe-auth: true
        association:
          function: .generated/actions/app-management/association.js
          web: yes
          runtime: nodejs:26
          annotations:
            final: true
            require-adobe-auth: true
            include-ims-credentials: true
        installation:
          function: .generated/actions/app-management/installation.js
          web: yes
          runtime: nodejs:26
          annotations:
            final: true
            require-adobe-auth: true
            include-ims-credentials: true
          limits:
            timeout: 600000

    sample-consumer:
      license: UNLICENSED
      actions:
        orders-sync:
          # Not a web action: only callers with this namespace's Runtime credentials can invoke it.
          function: ../../actions/orders-sync/index.js
          web: 'no'
          runtime: nodejs:22
          annotations:
            final: true
          inputs:
            # The ONLY integration points with the Error Monitor: where to send, and the shared signing key.
            ERROR_MONITOR_ENDPOINT: $ERROR_MONITOR_ENDPOINT
            ERROR_MONITOR_SIGNING_KEY: $ERROR_MONITOR_SIGNING_KEY
            UPSTREAM_TOKEN: $UPSTREAM_TOKEN
        validate-cart:
          # Commerce webhook (observer.sales_quote_add_item); Commerce calls it with an Adobe IMS token.
          function: ../../actions/validate-cart/index.js
          web: 'yes'
          runtime: nodejs:22
          annotations:
            require-adobe-auth: true
            final: true
          inputs:
            ERROR_MONITOR_ENDPOINT: $ERROR_MONITOR_ENDPOINT
            ERROR_MONITOR_SIGNING_KEY: $ERROR_MONITOR_SIGNING_KEY
            UPSTREAM_TOKEN: $UPSTREAM_TOKEN
            FAIL_ADD_TO_CART_SKUS: $FAIL_ADD_TO_CART_SKUS
        order-placed:
          # Commerce event handler (observer.sales_order_place_after), invoked by Adobe I/O Events.
          function: ../../actions/order-placed/index.js
          web: 'no'
          runtime: nodejs:22
          annotations:
            require-adobe-auth: false
            final: true
          inputs:
            ERROR_MONITOR_ENDPOINT: $ERROR_MONITOR_ENDPOINT
            ERROR_MONITOR_SIGNING_KEY: $ERROR_MONITOR_SIGNING_KEY
            UPSTREAM_TOKEN: $UPSTREAM_TOKEN
            FAIL_ORDER_SYNC_SKUS: $FAIL_ORDER_SYNC_SKUS
