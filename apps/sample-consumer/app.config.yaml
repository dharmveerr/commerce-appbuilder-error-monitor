application:
  runtimeManifest:
    packages:
      sample-consumer:
        license: UNLICENSED
        actions:
          orders-sync:
            function: actions/orders-sync/index.js
            web: 'yes'
            runtime: nodejs:20
            annotations:
              require-adobe-auth: false
              final: true
            inputs:
              # The ONLY integration points with the Error Monitor: where to send, and the shared signing key.
              ERROR_MONITOR_ENDPOINT: $ERROR_MONITOR_ENDPOINT
              ERROR_MONITOR_SIGNING_KEY: $ERROR_MONITOR_SIGNING_KEY
              UPSTREAM_TOKEN: $UPSTREAM_TOKEN
