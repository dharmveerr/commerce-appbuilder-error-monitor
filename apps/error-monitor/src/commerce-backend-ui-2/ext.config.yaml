# The build manages the `hooks`, `operations` and `web` keys of this file from app.commerce.config.ts
# (the menu adds a `view` operation and `web: web-src`). Do not hand-edit those.
# Our own package below is preserved across builds. Do not use the reserved package name `app-management`.
runtimeManifest:
  packages:
    error-monitor:
      license: UNLICENSED
      actions:
        record-error:
          function: actions/record-error/index.js
          web: 'yes'
          runtime: nodejs:22
          # Machine-to-machine ingest: authenticated by HMAC over the raw body, not by IMS.
          annotations:
            require-adobe-auth: false
            raw-http: true
            final: true
          limits:
            timeout: 30000
            memorySize: 256
          inputs:
            COMMERCE_INSTANCE_ID: $COMMERCE_INSTANCE_ID
            INGEST_SIGNING_KEY: $INGEST_SIGNING_KEY
            STATE_TTL_SECONDS: $STATE_TTL_SECONDS
            ARCHIVE_ENABLED: $ARCHIVE_ENABLED
            EVENTS_ENABLED: $EVENTS_ENABLED
            EVENT_PROVIDER_ID: $EVENT_PROVIDER_ID
            EVENT_CODE: $EVENT_CODE
            EVENT_MIN_SEVERITY: $EVENT_MIN_SEVERITY
            IMS_ORG_ID: $IMS_ORG_ID
            IMS_CLIENT_ID: $IMS_CLIENT_ID
            IMS_CLIENT_SECRET: $IMS_CLIENT_SECRET
            IMS_SCOPES: $IMS_SCOPES
        list-errors:
          function: actions/list-errors/index.js
          web: 'yes'
          runtime: nodejs:22
          annotations:
            require-adobe-auth: true
            final: true
          inputs:
            COMMERCE_INSTANCE_ID: $COMMERCE_INSTANCE_ID
            IMS_ORG_ID: $IMS_ORG_ID
            ARCHIVE_ENABLED: $ARCHIVE_ENABLED
        get-error:
          function: actions/get-error/index.js
          web: 'yes'
          runtime: nodejs:22
          annotations:
            require-adobe-auth: true
            final: true
          inputs:
            COMMERCE_INSTANCE_ID: $COMMERCE_INSTANCE_ID
            IMS_ORG_ID: $IMS_ORG_ID
            ARCHIVE_ENABLED: $ARCHIVE_ENABLED
web: web-src

# The [pre-app-build, pre-app-dev, pre-app-run] hooks are auto-generated. Do not remove or manually edit.
hooks:
  pre-app-build: EXTENSION=backend-ui/2 npx aio-commerce-lib-app hooks pre-app-build
  pre-app-dev: EXTENSION=backend-ui/2 npx aio-commerce-lib-app hooks pre-app-dev
  pre-app-run: EXTENSION=backend-ui/2 npx aio-commerce-lib-app hooks pre-app-run

operations:
  view:
    - type: web
      impl: index.html
